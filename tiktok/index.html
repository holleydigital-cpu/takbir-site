<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Takbir</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Takbir — Le scroll peut attendre, la prière non">
  <meta property="og:image" content="https://takbir-app.com/icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../icon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .out { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; padding: 24px; text-align: center; }
    .out h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
    .out p { margin: 0; color: #9A9A9A; font-size: 14px; line-height: 1.5; max-width: 320px; }
    .out .dots { color: #E9D6AE; font-weight: 700; }
    .safari { display: inline-block; padding: 14px 26px; border-radius: 999px; font-weight: 600;
              font-size: 16px; color: #E9D6AE; border: 1.5px solid #C9A86A; text-decoration: none; }
  </style>
  <script>
    // Lien à mettre en bio TikTok / Instagram : https://takbir-app.com/tiktok
    // Dans un vrai navigateur : on va directement sur le site.
    // Dans le navigateur intégré de TikTok (qui ne montre pas la bannière App Store),
    // la page s'affiche avec deux choix : App Store, ou « Ouvrir dans Safari ».
    (function () {
      var ua = navigator.userAgent || "";
      var inApp = /TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV|Snapchat|Twitter/i.test(ua);
      if (!inApp) location.replace("https://takbir-app.com/?from=tiktok");
    })();
  </script>
</head>
<body>
  <main class="out">
    <img class="app-icon" src="../icon.png" alt="Takbir">
    <h1>Le scroll peut attendre,<br><span class="gold">la prière non.</span></h1>
    <a class="store-button" href="https://apps.apple.com/app/id6829789838">
      <span><small>Télécharger sur</small> App Store</span>
    </a>
    <a class="safari" id="safari" href="x-safari-https://takbir-app.com/?from=tiktok">Ouvrir dans Safari</a>
    <p>Si rien ne s’ouvre : touche <span class="dots">•••</span> en haut à droite,<br>puis « Ouvrir dans le navigateur ».</p>
  </main>
  <script>
    // Sur Android, le bouton ouvre Chrome (ou le navigateur par défaut).
    if (/Android/i.test(navigator.userAgent)) {
      var b = document.getElementById("safari");
      b.href = "intent://takbir-app.com/?from=tiktok#Intent;scheme=https;end";
      b.textContent = "Ouvrir dans le navigateur";
    }
  </script>
</body>
</html>
